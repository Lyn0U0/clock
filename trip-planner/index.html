<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊行程規劃</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2430;
      --muted: #7a8194;
      --border: #e6e8ef;
      --accent: #4f6ef7;
      --danger: #e5484d;
      --radius: 14px;
      --sidebar-w: 380px;
      --day1: #4f6ef7;
      --day2: #12a594;
      --day3: #f5a524;
      --day4: #e5484d;
      --day5: #8e4ec6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    /* ---------- 左側：行程表 ---------- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(20, 24, 40, .06);
      z-index: 2;
    }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .sidebar-header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stats {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats strong { color: var(--text); }
    .days {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .day {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }
    .day-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #fafbfd;
      border-bottom: 1px solid var(--border);
    }
    .day-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent);
    }
    .day-title { font-weight: 700; font-size: 15px; }
    .day-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: #eef0f5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .day-list { list-style: none; margin: 0; padding: 6px; }
    .day-empty {
      padding: 14px 10px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .spot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .spot:hover { background: #f3f5fa; }
    .spot.highlight { animation: flash 1.2s ease; }
    @keyframes flash {
      0%, 60% { background: color-mix(in srgb, var(--c) 16%, transparent); }
      100% { background: transparent; }
    }
    .spot-index {
      flex-shrink: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--c);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .spot-info { flex: 1; min-width: 0; }
    .spot-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spot-coord { font-size: 11px; color: var(--muted); }
    .btn-delete {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-delete:hover { background: #fdecec; color: var(--danger); }

    /* ---------- 右側：地圖 ---------- */
    .map-wrap { flex: 1; position: relative; height: 100%; }
    #map { position: absolute; inset: 0; }
    .map-hint {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(31, 36, 48, .85);
      color: #fff;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      pointer-events: none;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* 尚未設定金鑰 / 金鑰錯誤時的提示 */
    .setup {
      position: absolute;
      inset: 0;
      z-index: 600;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }
    .setup[hidden] { display: none; }
    .setup-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(20, 24, 40, .08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setup-card h2 { margin: 0; font-size: 18px; }
    .setup-card p, .setup-card ol { margin: 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
    .setup-card ol { padding-left: 20px; }
    .setup-card a { color: var(--accent); }
    .setup-card code { background: #eef0f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .setup-error { color: var(--danger) !important; font-weight: 500; }
    .setup-form { display: flex; gap: 8px; }
    .setup-form input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .setup-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 110, 247, .15); }
    .setup-form .btn-primary { margin: 0; padding: 8px 14px; }

    /* 圖釘：尖端對齊座標點 */
    .pin-wrap { width: 30px; height: 36px; display: flex; justify-content: center; cursor: pointer; }
    .pin {
      width: 30px; height: 30px;
      border-radius: 50% 50% 50% 0;
      background: var(--c);
      transform: rotate(-45deg);
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
      display: grid;
      place-items: center;
    }
    .pin span {
      transform: rotate(45deg);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-family: "Noto Sans TC", system-ui, sans-serif;
    }

    /* 彈出表單 */
    .add-form { width: 240px; padding: 4px 2px 2px; display: flex; flex-direction: column; gap: 10px; font-family: "Noto Sans TC", system-ui, sans-serif; }
    .add-form h3 { margin: 0; font-size: 15px; }
    .add-form .coord { margin: -6px 0 2px; font-size: 11px; color: var(--muted); }
    .add-form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .add-form input, .add-form select {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .add-form input:focus, .add-form select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .15);
    }
    .add-form input.invalid { border-color: var(--danger); }
    .btn-primary {
      margin-top: 4px;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    /* 手機版：上下堆疊 */
    @media (max-width: 760px) {
      body { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 45%; border-right: none; border-top: 1px solid var(--border); }
      .map-wrap { height: 55%; flex: none; }
      .sidebar-header { padding: 14px 16px 10px; }
      .map-hint { font-size: 12px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>旅遊行程規劃</h1>
      <p>點擊地圖任意位置，即可把景點加入每日行程。</p>
      <div class="stats">共 <strong id="total">0</strong> 個景點</div>
    </div>
    <div class="days" id="days"></div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="map-hint">點擊地圖新增景點</div>
    <div class="setup" id="setup" hidden>
      <div class="setup-card">
        <h2>設定 Google Maps 金鑰</h2>
        <p class="setup-error" id="setup-error" hidden></p>
        <ol>
          <li>到 <a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> 建立 API 金鑰。</li>
          <li>啟用 <strong>Maps JavaScript API</strong>（點地圖上的店家自動帶入名稱，需再啟用 <strong>Places API (New)</strong>）。</li>
          <li>在金鑰的「應用程式限制」選「網站」，加入 <code>lyn0u0.github.io/*</code>。</li>
        </ol>
        <p>正式使用時，把金鑰填進 <code>index.html</code> 的 <code>GOOGLE_MAPS_API_KEY</code>。想先試用，可直接貼在下方，只會存在這台瀏覽器。</p>
        <form class="setup-form" id="setup-form">
          <input id="setup-key" type="text" placeholder="貼上 API 金鑰（AIza…）" autocomplete="off" spellcheck="false">
          <button type="submit" class="btn-primary">使用金鑰</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    // ---------- Google Maps 設定 ----------
    // 填入你的 Google Maps API 金鑰（請在 Google Cloud 限制可使用的網站）
    const GOOGLE_MAPS_API_KEY = '';
    // Advanced Marker 需要 Map ID；DEMO_MAP_ID 可用於開發，正式上線請換成自己的 Map ID
    const GOOGLE_MAP_ID = 'DEMO_MAP_ID';
    const KEY_STORAGE = 'trip-planner-gmaps-key';

    const DAYS = [1, 2, 3, 4, 5];
    const STORAGE_KEY = 'trip-planner-spots';

    // 單一資料來源：所有景點都存在這裡，清單與圖釘都由它產生
    let spots = loadSpots();
    const markers = new Map(); // spot.id -> AdvancedMarkerElement

    function loadSpots() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveSpots() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
      } catch {
        // 無法儲存時（例如無痕模式）就只保留在記憶體中
      }
    }

    function dayColor(day) {
      return `var(--day${day})`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // ---------- 地圖 ----------
    let map, infoWindow, AdvancedMarkerElement, Place;

    function getApiKey() {
      if (GOOGLE_MAPS_API_KEY) return GOOGLE_MAPS_API_KEY;
      try {
        return localStorage.getItem(KEY_STORAGE) || '';
      } catch {
        return '';
      }
    }

    function showSetup(error) {
      document.getElementById('setup').hidden = false;
      const el = document.getElementById('setup-error');
      el.hidden = !error;
      el.textContent = error || '';
    }

    document.getElementById('setup-form').addEventListener('submit', e => {
      e.preventDefault();
      const key = document.getElementById('setup-key').value.trim();
      if (!key) return;
      try {
        localStorage.setItem(KEY_STORAGE, key);
      } catch {
        // 無法儲存時（例如無痕模式）只能改用程式碼裡的 GOOGLE_MAPS_API_KEY
      }
      location.reload();
    });

    // 金鑰無效或網站未授權時，Google 會呼叫這個函式
    window.gm_authFailure = () => {
      try {
        localStorage.removeItem(KEY_STORAGE);
      } catch {}
      showSetup('金鑰無法使用：請確認金鑰正確、已啟用 Maps JavaScript API，且已允許此網站。');
    };

    function loadGoogleMaps(key) {
      return new Promise((resolve, reject) => {
        window.__initGoogleMaps = resolve;
        const script = document.createElement('script');
        const params = new URLSearchParams({ key, v: 'weekly', loading: 'async', language: 'zh-TW', callback: '__initGoogleMaps' });
        script.src = `https://maps.googleapis.com/maps/api/js?${params}`;
        script.async = true;
        script.onerror = () => reject(new Error('Google Maps 無法載入'));
        document.head.append(script);
      });
    }

    async function initMap() {
      const { Map, InfoWindow } = await google.maps.importLibrary('maps');
      ({ AdvancedMarkerElement } = await google.maps.importLibrary('marker'));
      try {
        ({ Place } = await google.maps.importLibrary('places'));
      } catch {
        Place = null; // 沒有 Places API 也能正常打點，只是不會自動帶入名稱
      }

      map = new Map(document.getElementById('map'), {
        center: { lat: 25.0375, lng: 121.5637 },
        zoom: 13,
        mapId: GOOGLE_MAP_ID,
        clickableIcons: true,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        gestureHandling: 'greedy'
      });
      infoWindow = new InfoWindow();

      // 點擊地圖 → 在點擊處彈出新增表單
      map.addListener('click', e => {
        if (!e.latLng) return;
        if (e.placeId) {
          e.stop(); // 點到店家/景點時，改用我們的表單取代 Google 預設資訊框
        }
        openAddForm(e.latLng, e.placeId);
      });

      render();
      if (spots.length) {
        const bounds = new google.maps.LatLngBounds();
        spots.forEach(s => bounds.extend({ lat: s.lat, lng: s.lng }));
        map.fitBounds(bounds, 60);
        if (spots.length === 1) map.setZoom(15);
      }
    }

    function openAddForm(latLng, placeId) {
      const lat = latLng.lat();
      const lng = latLng.lng();
      const form = document.createElement('form');
      form.className = 'add-form';
      form.innerHTML = `
        <h3>新增景點</h3>
        <div class="coord">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
        <label>景點名稱
          <input name="name" type="text" placeholder="例如：台北 101" maxlength="40" autocomplete="off">
        </label>
        <label>選擇天數
          <select name="day">
            ${DAYS.map(d => `<option value="${d}">Day ${d}</option>`).join('')}
          </select>
        </label>
        <button type="submit" class="btn-primary">加入行程</button>
      `;
      const input = form.elements.name;
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        const name = input.value.trim();
        if (!name) {
          input.classList.add('invalid');
          input.focus();
          return;
        }
        addSpot({ name, day: Number(form.elements.day.value), lat, lng, placeId: placeId || null });
        infoWindow.close();
      });
      input.addEventListener('input', () => input.classList.remove('invalid'));

      infoWindow.setContent(form);
      infoWindow.setPosition(latLng);
      infoWindow.open({ map });
      google.maps.event.addListenerOnce(infoWindow, 'domready', () => input.focus());

      // 點到 Google 地圖上的地點時，自動帶入地點名稱
      if (placeId && Place) {
        new Place({ id: placeId, requestedLanguage: 'zh-TW' })
          .fetchFields({ fields: ['displayName'] })
          .then(({ place }) => {
            if (!input.value && place.displayName) input.value = place.displayName;
          })
          .catch(() => {});
      }
    }

    // ---------- 資料操作 ----------
    function addSpot({ name, day, lat, lng, placeId }) {
      const spot = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, day, lat, lng, placeId };
      spots.push(spot);
      saveSpots();
      render();
      highlight(spot.id);
    }

    function deleteSpot(id) {
      spots = spots.filter(s => s.id !== id);
      saveSpots();
      render();
    }

    // ---------- 畫面同步 ----------
    // 每次資料變動都重新產生清單，並讓地圖圖釘與資料保持一致
    function render() {
      renderSidebar();
      if (map) syncMarkers();
      document.getElementById('total').textContent = spots.length;
    }

    function spotsOfDay(day) {
      return spots.filter(s => s.day === day);
    }

    function renderSidebar() {
      const container = document.getElementById('days');
      container.innerHTML = DAYS.map(day => {
        const list = spotsOfDay(day);
        const items = list.length
          ? list.map((s, i) => `
              <li class="spot" data-id="${s.id}" style="--c:${dayColor(day)}">
                <span class="spot-index">${i + 1}</span>
                <div class="spot-info">
                  <div class="spot-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
                  <div class="spot-coord">${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</div>
                </div>
                <button class="btn-delete" data-delete="${s.id}" title="刪除此景點">刪除</button>
              </li>`).join('')
          : `<li class="day-empty">尚未安排景點</li>`;
        return `
          <section class="day" style="--c:${dayColor(day)}">
            <div class="day-head">
              <span class="day-dot"></span>
              <span class="day-title">Day ${day}</span>
              <span class="day-count">${list.length} 個景點</span>
            </div>
            <ul class="day-list">${items}</ul>
          </section>`;
      }).join('');
    }

    function makePin(spot, index) {
      const wrap = document.createElement('div');
      wrap.className = 'pin-wrap';
      wrap.innerHTML = `<div class="pin" style="--c:${dayColor(spot.day)}"><span>${spot.day}-${index}</span></div>`;
      return wrap;
    }

    function syncMarkers() {
      const ids = new Set(spots.map(s => s.id));
      // 移除已刪除景點的圖釘
      for (const [id, marker] of markers) {
        if (!ids.has(id)) {
          marker.map = null;
          markers.delete(id);
        }
      }
      // 新增或更新其餘圖釘（序號可能因刪除而改變）
      DAYS.forEach(day => {
        spotsOfDay(day).forEach((spot, i) => {
          let marker = markers.get(spot.id);
          if (!marker) {
            marker = new AdvancedMarkerElement({ map, position: { lat: spot.lat, lng: spot.lng } });
            marker.addListener('gmp-click', () => highlight(spot.id));
            markers.set(spot.id, marker);
          }
          marker.content = makePin(spot, i + 1);
          marker.title = `Day ${spot.day}・${spot.name}`;
        });
      });
    }

    function highlight(id) {
      const el = document.querySelector(`.spot[data-id="${id}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      el.classList.remove('highlight');
      void el.offsetWidth; // 重新觸發動畫
      el.classList.add('highlight');
    }

    // 左側清單：點刪除 → 移除；點景點 → 地圖飛到該圖釘
    document.getElementById('days').addEventListener('click', e => {
      const delId = e.target.closest('[data-delete]')?.dataset.delete;
      if (delId) {
        deleteSpot(delId);
        return;
      }
      const id = e.target.closest('.spot')?.dataset.id;
      const spot = id && spots.find(s => s.id === id);
      if (spot && map) {
        map.panTo({ lat: spot.lat, lng: spot.lng });
        if (map.getZoom() < 15) map.setZoom(15);
      }
    });

    render();
    const apiKey = getApiKey();
    if (apiKey) {
      loadGoogleMaps(apiKey).then(initMap).catch(err => showSetup(err.message));
    } else {
      showSetup();
    }
  </script>
</body>
</html>
