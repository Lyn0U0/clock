<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊行程規劃</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>旅遊行程規劃</h1>
      <p>點擊地圖加入景點，拖曳或用箭頭調整每天的順序。</p>
      <div class="summary" id="summary"></div>
      <div class="mode-picker" id="mode-picker" role="radiogroup" aria-label="交通方式"></div>
    </div>
    <div class="tabs-bar">
      <nav class="tabs" id="tabs" role="tablist" aria-label="切換天數"></nav>
      <button class="tab tab-add" data-action="add-day" title="新增一天">+ Day</button>
    </div>
    <div class="day-list" id="day-list"></div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="map-hint">點擊地圖新增景點</div>
    <div class="setup" id="setup" hidden>
      <div class="setup-card">
        <h2>設定 Google Maps 金鑰</h2>
        <p class="setup-error" id="setup-error" hidden></p>
        <ol>
          <li>到 <a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> 建立 API 金鑰。</li>
          <li>啟用 <strong>Maps JavaScript API</strong> 與 <strong>Routes API</strong>（交通時間）；點地圖上的店家自動帶入名稱，需再啟用 <strong>Places API (New)</strong>。</li>
          <li>在金鑰的「應用程式限制」選「網站」，加入 <code>lyn0u0.github.io/*</code>。</li>
        </ol>
        <p>正式使用時，把金鑰填進 <code>app.js</code> 的 <code>GOOGLE_MAPS_API_KEY</code>。想先試用，可直接貼在下方，只會存在這台瀏覽器。</p>
        <form class="setup-form" id="setup-form">
          <input id="setup-key" type="text" placeholder="貼上 API 金鑰（AIza…）" autocomplete="off" spellcheck="false">
          <button type="submit" class="btn-primary">使用金鑰</button>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
