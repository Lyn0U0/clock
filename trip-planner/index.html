<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊行程規劃</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2430;
      --muted: #7a8194;
      --border: #e6e8ef;
      --accent: #4f6ef7;
      --danger: #e5484d;
      --radius: 14px;
      --sidebar-w: 380px;
      --day1: #4f6ef7;
      --day2: #12a594;
      --day3: #f5a524;
      --day4: #e5484d;
      --day5: #8e4ec6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    /* ---------- 左側：行程表 ---------- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(20, 24, 40, .06);
      z-index: 2;
    }
    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .sidebar-header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stats {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .stats strong { color: var(--text); }
    .days {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .day {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }
    .day-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #fafbfd;
      border-bottom: 1px solid var(--border);
    }
    .day-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent);
    }
    .day-title { font-weight: 700; font-size: 15px; }
    .day-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: #eef0f5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .day-list { list-style: none; margin: 0; padding: 6px; }
    .day-empty {
      padding: 14px 10px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .spot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .spot:hover { background: #f3f5fa; }
    .spot.highlight { animation: flash 1.2s ease; }
    @keyframes flash {
      0%, 60% { background: color-mix(in srgb, var(--c) 16%, transparent); }
      100% { background: transparent; }
    }
    .spot-index {
      flex-shrink: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--c);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .spot-info { flex: 1; min-width: 0; }
    .spot-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spot-coord { font-size: 11px; color: var(--muted); }
    .btn-delete {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-delete:hover { background: #fdecec; color: var(--danger); }

    /* ---------- 右側：地圖 ---------- */
    .map-wrap { flex: 1; position: relative; height: 100%; }
    #map { position: absolute; inset: 0; }
    .map-hint {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(31, 36, 48, .85);
      color: #fff;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      pointer-events: none;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* 圖釘 */
    .pin {
      width: 30px; height: 30px;
      border-radius: 50% 50% 50% 0;
      background: var(--c);
      transform: rotate(-45deg);
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
      display: grid;
      place-items: center;
    }
    .pin span {
      transform: rotate(45deg);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-family: "Noto Sans TC", system-ui, sans-serif;
    }

    /* 彈出表單 */
    .leaflet-popup-content-wrapper { border-radius: var(--radius); box-shadow: 0 10px 30px rgba(20, 24, 40, .18); }
    .leaflet-popup-content { margin: 16px; width: 240px !important; }
    .add-form { display: flex; flex-direction: column; gap: 10px; font-family: "Noto Sans TC", system-ui, sans-serif; }
    .add-form h3 { margin: 0; font-size: 15px; }
    .add-form .coord { margin: -6px 0 2px; font-size: 11px; color: var(--muted); }
    .add-form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .add-form input, .add-form select {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .add-form input:focus, .add-form select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .15);
    }
    .add-form input.invalid { border-color: var(--danger); }
    .btn-primary {
      margin-top: 4px;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    /* 手機版：上下堆疊 */
    @media (max-width: 760px) {
      body { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 45%; border-right: none; border-top: 1px solid var(--border); }
      .map-wrap { height: 55%; flex: none; }
      .sidebar-header { padding: 14px 16px 10px; }
      .map-hint { font-size: 12px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>旅遊行程規劃</h1>
      <p>點擊地圖任意位置，即可把景點加入每日行程。</p>
      <div class="stats">共 <strong id="total">0</strong> 個景點</div>
    </div>
    <div class="days" id="days"></div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="map-hint">點擊地圖新增景點</div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DAYS = [1, 2, 3, 4, 5];
    const STORAGE_KEY = 'trip-planner-spots';

    // 單一資料來源：所有景點都存在這裡，清單與圖釘都由它產生
    let spots = loadSpots();
    const markers = new Map(); // spot.id -> L.marker

    function loadSpots() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveSpots() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
      } catch {
        // 無法儲存時（例如無痕模式）就只保留在記憶體中
      }
    }

    function dayColor(day) {
      return `var(--day${day})`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // ---------- 地圖 ----------
    const map = L.map('map', { zoomControl: false }).setView([25.0375, 121.5637], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    // 點擊地圖 → 在點擊處彈出新增表單
    map.on('click', e => {
      const { lat, lng } = e.latlng;
      const form = document.createElement('form');
      form.className = 'add-form';
      form.innerHTML = `
        <h3>新增景點</h3>
        <div class="coord">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
        <label>景點名稱
          <input name="name" type="text" placeholder="例如：台北 101" maxlength="40" autocomplete="off">
        </label>
        <label>選擇天數
          <select name="day">
            ${DAYS.map(d => `<option value="${d}">Day ${d}</option>`).join('')}
          </select>
        </label>
        <button type="submit" class="btn-primary">加入行程</button>
      `;
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        const input = form.elements.name;
        const name = input.value.trim();
        if (!name) {
          input.classList.add('invalid');
          input.focus();
          return;
        }
        addSpot({ name, day: Number(form.elements.day.value), lat, lng });
        map.closePopup();
      });
      form.elements.name.addEventListener('input', ev => ev.target.classList.remove('invalid'));

      L.popup({ closeButton: true, autoPanPadding: [40, 40] })
        .setLatLng(e.latlng)
        .setContent(form)
        .openOn(map);
      setTimeout(() => form.elements.name.focus(), 50);
    });

    // ---------- 資料操作 ----------
    function addSpot({ name, day, lat, lng }) {
      const spot = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, day, lat, lng };
      spots.push(spot);
      saveSpots();
      render();
      highlight(spot.id);
    }

    function deleteSpot(id) {
      spots = spots.filter(s => s.id !== id);
      saveSpots();
      render();
    }

    // ---------- 畫面同步 ----------
    // 每次資料變動都重新產生清單，並讓地圖圖釘與資料保持一致
    function render() {
      renderSidebar();
      syncMarkers();
      document.getElementById('total').textContent = spots.length;
    }

    function spotsOfDay(day) {
      return spots.filter(s => s.day === day);
    }

    function renderSidebar() {
      const container = document.getElementById('days');
      container.innerHTML = DAYS.map(day => {
        const list = spotsOfDay(day);
        const items = list.length
          ? list.map((s, i) => `
              <li class="spot" data-id="${s.id}" style="--c:${dayColor(day)}">
                <span class="spot-index">${i + 1}</span>
                <div class="spot-info">
                  <div class="spot-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
                  <div class="spot-coord">${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</div>
                </div>
                <button class="btn-delete" data-delete="${s.id}" title="刪除此景點">刪除</button>
              </li>`).join('')
          : `<li class="day-empty">尚未安排景點</li>`;
        return `
          <section class="day" style="--c:${dayColor(day)}">
            <div class="day-head">
              <span class="day-dot"></span>
              <span class="day-title">Day ${day}</span>
              <span class="day-count">${list.length} 個景點</span>
            </div>
            <ul class="day-list">${items}</ul>
          </section>`;
      }).join('');
    }

    function makeIcon(spot, index) {
      return L.divIcon({
        className: '',
        html: `<div class="pin" style="--c:${dayColor(spot.day)}"><span>${spot.day}-${index}</span></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 34],
        popupAnchor: [0, -32]
      });
    }

    function syncMarkers() {
      const ids = new Set(spots.map(s => s.id));
      // 移除已刪除景點的圖釘
      for (const [id, marker] of markers) {
        if (!ids.has(id)) {
          map.removeLayer(marker);
          markers.delete(id);
        }
      }
      // 新增或更新其餘圖釘（序號可能因刪除而改變）
      DAYS.forEach(day => {
        spotsOfDay(day).forEach((spot, i) => {
          const icon = makeIcon(spot, i + 1);
          let marker = markers.get(spot.id);
          if (!marker) {
            marker = L.marker([spot.lat, spot.lng], { icon })
              .addTo(map)
              .on('click', () => highlight(spot.id));
            markers.set(spot.id, marker);
          } else {
            marker.setIcon(icon);
          }
          marker.bindTooltip(`Day ${spot.day}・${escapeHtml(spot.name)}`, { direction: 'top', offset: [0, -30] });
        });
      });
    }

    function highlight(id) {
      const el = document.querySelector(`.spot[data-id="${id}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      el.classList.remove('highlight');
      void el.offsetWidth; // 重新觸發動畫
      el.classList.add('highlight');
    }

    // 左側清單：點刪除 → 移除；點景點 → 地圖飛到該圖釘
    document.getElementById('days').addEventListener('click', e => {
      const delId = e.target.closest('[data-delete]')?.dataset.delete;
      if (delId) {
        deleteSpot(delId);
        return;
      }
      const id = e.target.closest('.spot')?.dataset.id;
      const spot = id && spots.find(s => s.id === id);
      if (spot) {
        map.flyTo([spot.lat, spot.lng], Math.max(map.getZoom(), 15), { duration: 0.6 });
        markers.get(id)?.openTooltip();
      }
    });

    render();
    if (spots.length) {
      map.fitBounds(L.latLngBounds(spots.map(s => [s.lat, s.lng])), { padding: [60, 60], maxZoom: 15 });
    }
  </script>
</body>
</html>
